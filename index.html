<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lo Que Cuento</title>
<meta name="description" content="Un cuaderno privado para contar todo: una página por día, con renglones, clima del ánimo y etiquetas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Spline+Sans+Mono:wght@400;500&family=Young+Serif&display=swap">
<style>
/* Concepto: un cuaderno de renglones sobre la mesa. A la izquierda el índice (calendario del mes y
   páginas escritas); a la derecha la hoja abierta, con margen rosa y renglones azules que siguen al texto.
   Tinta azul-negra de pluma; de noche, la hoja se vuelve azul profundo. */
:root {
  --mesa: #ECEDE7;          /* fondo: la mesa */
  --hoja: #FBFBF7;          /* la página */
  --tinta: #24234B;         /* tinta azul-negra */
  --tinta-2: #5E6079;       /* texto secundario */
  --acento: #3B3CA6;        /* botones y foco */
  --sobre-acento: #FBFBF7;
  --renglon: rgba(64, 104, 170, .2);
  --margen: #D9616F;        /* línea del margen */
  --linea: rgba(36, 35, 75, .12);
  --sombra: 0 1px 0 rgba(36, 35, 75, .06), 0 24px 48px -28px rgba(36, 35, 75, .35);
  --c1: #D99A12;  /* despejado */
  --c2: #5E9A5A;  /* templado */
  --c3: #8A92A8;  /* nublado */
  --c4: #3E76C0;  /* lluvia */
  --c5: #7553B6;  /* tormenta */

  --f-titulo: "Young Serif", "Iowan Old Style", Georgia, serif;
  --f-texto: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-dato: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --r: 2rem;                /* alto de un renglón */
  --gutter: 1rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --mesa: #0F1122; --hoja: #171A30; --tinta: #E9E7F3; --tinta-2: #A2A4C0;
    --acento: #A3A4F7; --sobre-acento: #12142A;
    --renglon: rgba(140, 170, 235, .14); --margen: #E07A88; --linea: rgba(233, 231, 243, .1);
    --sombra: 0 1px 0 rgba(0, 0, 0, .3), 0 28px 56px -30px rgba(0, 0, 0, .8);
    --c1: #F0BE4A; --c2: #8CC488; --c3: #AAB1C6; --c4: #72A3E8; --c5: #A88AE8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --mesa: #0F1122; --hoja: #171A30; --tinta: #E9E7F3; --tinta-2: #A2A4C0;
  --acento: #A3A4F7; --sobre-acento: #12142A;
  --renglon: rgba(140, 170, 235, .14); --margen: #E07A88; --linea: rgba(233, 231, 243, .1);
  --sombra: 0 1px 0 rgba(0, 0, 0, .3), 0 28px 56px -30px rgba(0, 0, 0, .8);
  --c1: #F0BE4A; --c2: #8CC488; --c3: #AAB1C6; --c4: #72A3E8; --c5: #A88AE8;
  color-scheme: dark;
}
@media (min-width: 720px) { :root { --gutter: 1.5rem; } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--mesa);
  color: var(--tinta);
  font: 400 1.0625rem/1.55 var(--f-texto);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
p, h1, h2, h3, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.dato {
  font: 500 .7rem/1.3 var(--f-dato);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--tinta-2);
  font-variant-numeric: tabular-nums;
}

/* ---- Barra superior ------------------------------------------------------ */
.barra {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: color-mix(in srgb, var(--mesa) 88%, transparent);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--linea);
}
.barra__fila {
  display: flex;
  align-items: center;
  gap: 1rem;
  max-width: 1280px;
  margin-inline: auto;
  padding: .75rem var(--gutter);
}
.marca { display: flex; align-items: baseline; gap: .6rem; min-width: 0; }
.marca__nombre { font: 400 1.45rem/1 var(--f-titulo); letter-spacing: -.01em; white-space: nowrap; }
.marca__nombre i { font-family: var(--f-texto); font-style: italic; font-weight: 400; color: var(--margen); }
.marca .dato { display: none; }
@media (min-width: 720px) { .marca .dato { display: inline; } }
.barra__estado { margin-left: auto; display: flex; align-items: center; gap: .45rem; min-width: 0; }
.barra__estado .dato { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: none; letter-spacing: .02em; }
.punto { width: .5rem; height: .5rem; flex: none; border-radius: 50%; background: var(--c2); transition: background-color .3s; }
.punto[data-estado="guardando"] { background: var(--c1); }
.punto[data-estado="error"] { background: var(--margen); }
.punto[data-estado="espera"] { background: var(--c3); }
@media (max-width: 559px) { .barra__estado .dato { display: none; } }

.boton {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  min-height: 2.5rem;
  padding: .5rem 1rem;
  font: 500 .78rem/1 var(--f-dato);
  letter-spacing: .06em;
  text-transform: uppercase;
  border-radius: 999px;
  white-space: nowrap;
  transition: background-color .2s, color .2s, transform .15s;
}
.boton:active { transform: scale(.97); }
.boton--tinta { background: var(--acento); color: var(--sobre-acento); }
.boton--tinta:hover { background: var(--tinta); }
.boton--suave { color: var(--tinta-2); box-shadow: inset 0 0 0 1px var(--linea); }
.boton--suave:hover { color: var(--tinta); background: var(--linea); }
.boton svg { width: 16px; height: 16px; }

/* ---- Mesa: índice + hoja --------------------------------------------------- */
.mesa {
  display: grid;
  gap: 1.5rem;
  max-width: 1280px;
  margin-inline: auto;
  padding: 1.25rem var(--gutter) 3rem;
}
@media (min-width: 900px) {
  .mesa { grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 2.5rem; align-items: start; padding-top: 2rem; }
  .indice { position: sticky; top: calc(4.5rem + env(safe-area-inset-top, 0px)); max-height: calc(100dvh - 5.5rem); overflow-y: auto; scrollbar-width: thin; padding-right: .25rem; }
}
@media (max-width: 899px) {
  body[data-vista="hoja"] .indice { display: none; }
  body[data-vista="indice"] .escritorio { display: none; }
}

/* ---- Índice --------------------------------------------------------------- */
.indice { display: grid; gap: 1.5rem; align-content: start; min-width: 0; }

.mes { display: grid; gap: .75rem; }
.mes__cabeza { display: flex; align-items: center; justify-content: space-between; }
.mes__nombre { font: 400 1.2rem/1 var(--f-titulo); }
.mes__flechas { display: flex; gap: .25rem; }
.icono-boton {
  display: grid;
  place-items: center;
  width: 2.25rem;
  height: 2.25rem;
  border-radius: 50%;
  color: var(--tinta-2);
  transition: background-color .2s, color .2s;
}
.icono-boton:hover { background: var(--linea); color: var(--tinta); }
.icono-boton svg { width: 18px; height: 18px; }
.mes__dias {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: .2rem;
  text-align: center;
}
.mes__dias .dato { padding-bottom: .25rem; font-size: .62rem; }
.dia {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  max-width: 100%;
  font: 400 .78rem/1 var(--f-dato);
  font-variant-numeric: tabular-nums;
  color: var(--tinta-2);
  border-radius: 50%;
  transition: background-color .2s, color .2s;
}
.dia:hover { background: var(--linea); color: var(--tinta); }
.dia.is-futuro { opacity: .35; pointer-events: none; }
.dia.is-hoy { color: var(--tinta); box-shadow: inset 0 0 0 1.5px var(--tinta); }
.dia.is-abierto { background: var(--tinta); color: var(--hoja); }
/* Una gota de tinta del color del ánimo bajo el número */
.dia.tiene::after {
  content: "";
  position: absolute;
  bottom: 12%;
  width: .32rem;
  height: .32rem;
  border-radius: 50%;
  background: var(--clima, var(--tinta));
}
.dia.tiene { color: var(--tinta); font-weight: 500; }

.cifras { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; padding-block: .75rem; border-block: 1px solid var(--linea); }
.cifra { display: grid; gap: .15rem; }
.cifra__valor { font: 400 1.35rem/1 var(--f-titulo); font-variant-numeric: tabular-nums; }

.buscar { position: relative; }
.buscar svg { position: absolute; left: .85rem; top: 50%; width: 16px; height: 16px; translate: 0 -50%; color: var(--tinta-2); pointer-events: none; }
.buscar input {
  width: 100%;
  min-height: 2.6rem;
  padding: .5rem .9rem .5rem 2.4rem;
  font-size: 1rem;
  background: var(--hoja);
  border: 0;
  border-radius: 999px;
  box-shadow: inset 0 0 0 1px var(--linea);
}
.buscar input::placeholder { color: var(--tinta-2); opacity: .8; }
.buscar input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--acento); }

.etiquetas { display: flex; flex-wrap: wrap; gap: .35rem; }
.etiqueta {
  min-height: 1.9rem;
  padding: .3rem .7rem;
  font: 400 .74rem/1 var(--f-dato);
  color: var(--tinta-2);
  border-radius: 999px;
  box-shadow: inset 0 0 0 1px var(--linea);
  transition: background-color .2s, color .2s;
}
.etiqueta:hover { color: var(--tinta); }
.etiqueta[aria-pressed="true"] { background: var(--tinta); color: var(--hoja); box-shadow: none; }

.paginas { display: grid; gap: 1.25rem; }
.paginas__mes { display: grid; gap: .25rem; }
.paginas__mes > .dato { padding-bottom: .35rem; }
.pagina-item {
  display: grid;
  grid-template-columns: 2.6rem minmax(0, 1fr);
  gap: .75rem;
  width: 100%;
  padding: .7rem .75rem .7rem .5rem;
  text-align: left;
  border-radius: 10px;
  transition: background-color .2s;
}
.pagina-item:hover { background: color-mix(in srgb, var(--hoja) 70%, transparent); }
.pagina-item[aria-current="true"] { background: var(--hoja); box-shadow: var(--sombra); }
.pagina-item__fecha { display: grid; justify-items: center; align-content: start; gap: .2rem; }
.pagina-item__dia { font: 400 1.5rem/1 var(--f-titulo); font-variant-numeric: tabular-nums; }
.pagina-item__semana { font-size: .58rem; }
.pagina-item__texto { display: grid; gap: .15rem; min-width: 0; }
.pagina-item__titulo { display: flex; align-items: center; gap: .45rem; font: 500 1rem/1.3 var(--f-texto); }
.pagina-item__titulo span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pagina-item__titulo i { flex: none; width: .45rem; height: .45rem; border-radius: 50%; background: var(--clima, transparent); }
.pagina-item__extracto {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: .9rem;
  line-height: 1.4;
  color: var(--tinta-2);
}
.paginas__vacio { font-style: italic; color: var(--tinta-2); }

/* ---- Hoja abierta ------------------------------------------------------- */
.escritorio { display: grid; gap: .9rem; min-width: 0; }
.herramientas { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; }
.volver { margin-right: auto; }
@media (min-width: 900px) { .volver { display: none; } }

.fecha {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  min-height: 2.5rem;
  padding: .45rem .95rem;
  border-radius: 999px;
  box-shadow: inset 0 0 0 1px var(--linea);
  cursor: pointer;
}
.fecha:hover { background: var(--linea); }
.fecha:focus-within { box-shadow: inset 0 0 0 2px var(--acento); }
.fecha__texto { font: 400 .95rem/1 var(--f-texto); font-style: italic; }
.fecha input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.fecha svg { width: 16px; height: 16px; color: var(--tinta-2); }

.climas { display: flex; gap: .2rem; padding: .2rem; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--linea); }
.clima {
  display: grid;
  place-items: center;
  width: 2.15rem;
  height: 2.15rem;
  color: var(--tinta-2);
  border-radius: 50%;
  transition: background-color .2s, color .2s, transform .25s cubic-bezier(.34, 1.56, .64, 1);
}
.clima svg { width: 20px; height: 20px; }
.clima:hover { color: var(--c); transform: translateY(-1px); }
.clima[aria-pressed="true"] { color: var(--hoja); background: var(--c); }
.herramientas__fin { display: flex; align-items: center; gap: .5rem; margin-left: auto; }
@media (max-width: 899px) { .herramientas__fin { margin-left: 0; } }

/* El papel: margen rosa y renglones que avanzan con el texto */
.papel {
  position: relative;
  min-width: 0;
  padding: var(--r) clamp(1rem, 4vw, 3rem) calc(var(--r) * 2) calc(clamp(1rem, 4vw, 3rem) + 2.25rem);
  background-color: var(--hoja);
  background-image: linear-gradient(to bottom, transparent calc(var(--r) - 1px), var(--renglon) calc(var(--r) - 1px), var(--renglon) var(--r));
  background-size: 100% var(--r);
  background-position: 0 .35rem;
  border-radius: 4px 14px 14px 4px;
  box-shadow: var(--sombra);
}
.papel::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  left: calc(clamp(1rem, 4vw, 3rem) + .9rem);
  width: 1.5px;
  background: var(--margen);
  opacity: .7;
}
.papel__titulo,
.papel__cuerpo {
  display: block;
  width: 100%;
  padding: 0;
  background: transparent;
  border: 0;
  resize: none;
  color: var(--tinta);
}
.papel__titulo:focus,
.papel__cuerpo:focus { outline: none; }
.papel__titulo {
  height: calc(var(--r) * 2);
  font: 400 clamp(1.5rem, 1.2rem + 1.2vw, 2rem)/calc(var(--r) * 2) var(--f-titulo);
  letter-spacing: -.01em;
}
.papel__cuerpo {
  min-height: calc(var(--r) * 14);
  overflow: hidden;
  font: 400 1.15rem/var(--r) var(--f-texto);
  font-optical-sizing: auto;
  caret-color: var(--margen);
}
.papel__titulo::placeholder,
.papel__cuerpo::placeholder { color: var(--tinta-2); opacity: .55; }
.papel__cuerpo::placeholder { font-style: italic; }

.idea { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem; padding-inline: .25rem; }
.idea p { font-style: italic; color: var(--tinta-2); }
.idea .enlace { font: 500 .7rem/1 var(--f-dato); letter-spacing: .06em; text-transform: uppercase; color: var(--acento); text-decoration: underline; text-underline-offset: .3em; padding-block: .3rem; }

.pie-hoja { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem 1rem; padding-inline: .25rem; }
.pie-hoja__etiquetas { display: flex; flex-wrap: wrap; gap: .4rem; }
.pie-hoja__etiquetas span { color: var(--acento); }

.confirmar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
.confirmar p { font-style: italic; }
.boton--peligro { background: var(--margen); color: var(--hoja); }

.aviso {
  padding: .7rem 1rem;
  font-size: .95rem;
  border-radius: 10px;
  background: color-mix(in srgb, var(--margen) 14%, transparent);
  box-shadow: inset 3px 0 0 var(--margen);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>
<body data-vista="hoja">
<header class="barra">
  <div class="barra__fila">
    <div class="marca">
      <h1 class="marca__nombre">Lo que <i>cuento</i></h1>
      <span class="dato">cuaderno privado</span>
    </div>
    <div class="barra__estado" role="status" aria-live="polite">
      <span class="punto" data-punto data-estado="espera"></span>
      <span class="dato" data-estado-texto>Abriendo tu cuaderno…</span>
    </div>
    <button class="boton boton--tinta" type="button" data-nueva>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Nueva página
    </button>
  </div>
</header>

<div class="mesa">
  <aside class="indice" aria-label="Índice del cuaderno">
    <section class="mes" aria-labelledby="mes-nombre">
      <div class="mes__cabeza">
        <h2 class="mes__nombre" id="mes-nombre" data-mes-nombre></h2>
        <div class="mes__flechas">
          <button class="icono-boton" type="button" data-mes="-1"><span class="sr-only">Mes anterior</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="icono-boton" type="button" data-mes="1"><span class="sr-only">Mes siguiente</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
      <div class="mes__dias" data-dias></div>
    </section>

    <div class="cifras">
      <p class="cifra"><span class="cifra__valor" data-cifra="paginas">0</span><span class="dato">páginas</span></p>
      <p class="cifra"><span class="cifra__valor" data-cifra="racha">0</span><span class="dato">días seguidos</span></p>
      <p class="cifra"><span class="cifra__valor" data-cifra="palabras">0</span><span class="dato">palabras</span></p>
    </div>

    <label class="buscar">
      <span class="sr-only">Buscar en tus páginas</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="buscar" type="search" placeholder="Buscar en tus páginas" autocomplete="off" data-buscar>
    </label>
    <div class="etiquetas" data-etiquetas role="group" aria-label="Filtrar por etiqueta"></div>

    <nav class="paginas" data-paginas aria-label="Páginas escritas"></nav>
  </aside>

  <main class="escritorio">
    <div class="herramientas">
      <button class="boton boton--suave volver" type="button" data-ver-indice>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Índice
      </button>
      <label class="fecha">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 10h16M9 3.5v4M15 3.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="fecha__texto" data-fecha-texto></span>
        <span class="sr-only">Cambiar la fecha de la página</span>
        <input id="fecha" type="date" data-fecha>
      </label>
      <div class="climas" role="group" aria-label="¿Cómo estuvo tu día?" data-climas></div>
      <div class="herramientas__fin">
        <button class="boton boton--suave" type="button" data-borrar>Borrar</button>
      </div>
    </div>

    <div class="confirmar aviso" data-confirmar hidden>
      <p>¿Borrar esta página? No se puede deshacer.</p>
      <button class="boton boton--peligro" type="button" data-borrar-si>Sí, borrar</button>
      <button class="boton boton--suave" type="button" data-borrar-no>Cancelar</button>
    </div>
    <p class="aviso" data-aviso hidden></p>

    <article class="papel">
      <label class="sr-only" for="titulo">Título</label>
      <input class="papel__titulo" id="titulo" type="text" maxlength="140" placeholder="Sin título" autocomplete="off" data-titulo>
      <label class="sr-only" for="cuerpo">Lo que quieras contar</label>
      <textarea class="papel__cuerpo" id="cuerpo" spellcheck="true" data-cuerpo></textarea>
    </article>

    <div class="idea" data-idea>
      <p data-idea-texto></p>
      <button class="enlace" type="button" data-otra-idea>Otra idea</button>
    </div>

    <div class="pie-hoja">
      <p class="dato" data-conteo>0 palabras</p>
      <p class="pie-hoja__etiquetas dato" data-pie-etiquetas>Escribe #algo para etiquetar</p>
    </div>
  </main>
</div>

<script>
(() => {
  'use strict';

  /* ---------------- Datos fijos ---------------- */
  const IDEAS = [
    '¿Qué pasó hoy que no quieres olvidar?',
    '¿Qué te tuvo pensando más de la cuenta?',
    'Escribe sobre alguien que hoy te hizo bien.',
    '¿Qué te habría gustado decir y no dijiste?',
    'Tres cosas pequeñas que salieron bien.',
    '¿Qué te está costando trabajo ahorita?',
    'Describe dónde estás, como si nadie conociera el lugar.',
    '¿Qué harías mañana si nada te detuviera?',
    'Una conversación que se te quedó grabada.',
    '¿Qué aprendiste de ti esta semana?',
    'Algo que te dio risa, aunque sea tonto.',
    '¿De qué tienes ganas últimamente?',
    'Una carta para ti dentro de un año.',
    '¿Qué estás cargando que podrías soltar?',
    '¿Qué canción o frase traes en la cabeza y por qué?'
  ];
  const ICONO = {
    1: '<circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    2: '<circle cx="9" cy="9" r="3.4" fill="currentColor"/><path d="M9 2.5v1.6M2.5 9h1.6M4.4 4.4l1.1 1.1M13.6 4.4l-1.1 1.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8.5 19h9a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6 1.4A2.8 2.8 0 0 0 8.5 19z" fill="currentColor" opacity=".55"/>',
    3: '<path d="M7 18.5h10.5a4 4 0 0 0 .3-8A6 6 0 0 0 6.3 12 3.3 3.3 0 0 0 7 18.5z" fill="currentColor"/>',
    4: '<path d="M7 14.5h10.5a4 4 0 0 0 .3-8A6 6 0 0 0 6.3 8 3.3 3.3 0 0 0 7 14.5z" fill="currentColor"/><path d="M8.5 17.5l-1 2.5M12.5 17.5l-1 2.5M16.5 17.5l-1 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    5: '<path d="M7 13.5h10.5a4 4 0 0 0 .3-8A6 6 0 0 0 6.3 7 3.3 3.3 0 0 0 7 13.5z" fill="currentColor"/><path d="M12.5 13.5l-2.5 4h3l-2 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
  };
  const CLIMAS = [
    { v: 1, nombre: 'Despejado' },
    { v: 2, nombre: 'Templado' },
    { v: 3, nombre: 'Nublado' },
    { v: 4, nombre: 'Lluvia' },
    { v: 5, nombre: 'Tormenta' }
  ];

  /* ---------------- Utilidades ---------------- */
  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, '0');
  const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const aFecha = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
  const isoDe = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fmtLarga = new Intl.DateTimeFormat('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const fmtMes = new Intl.DateTimeFormat('es-MX', { month: 'long', year: 'numeric' });
  const fmtSemana = new Intl.DateTimeFormat('es-MX', { weekday: 'short' });
  const fmtHora = new Intl.DateTimeFormat('es-MX', { hour: 'numeric', minute: '2-digit' });
  const fmtNum = new Intl.NumberFormat('es-MX');
  const nuevoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const palabras = (t) => (t.trim().match(/\S+/g) || []).length;
  const etiquetasDe = (t) => [...new Set((t.match(/#[\p{L}\p{N}_-]+/gu) || []).map((x) => x.slice(1).toLowerCase()))];
  const normal = (t) => t.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
  const tieneTexto = (e) => Boolean((e.titulo || '').trim() || (e.cuerpo || '').trim());
  const ordenar = (a, b) => (b.fecha.localeCompare(a.fecha)) || ((b.creada || 0) - (a.creada || 0));
  const capital = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  /* ---------------- Estado ---------------- */
  const estado = {
    entradas: new Map(),   // id -> entrada guardada (o en camino)
    actual: null,          // entrada abierta en la hoja
    filtroTexto: '',
    filtroEtiqueta: null,
    mes: (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })(),
    cargado: false,
    idea: Math.floor(Math.random() * IDEAS.length)
  };
  const pendientes = new Set();   // ids con escritura en curso: la copia local manda
  const borradas = new Set();     // ids borrados aquí aunque el almacén aún no lo confirme
  let sucio = false, temporizador = null;

  /* ---------------- Almacén: cuenta de Claude (privado) o este navegador ---------------- */
  function almacenLocal() {
    const CLAVE = 'loquecuento:paginas';
    const leer = () => {
      try { const v = JSON.parse(localStorage.getItem(CLAVE) || '[]'); return Array.isArray(v) ? v : []; }
      catch (e) { return []; }
    };
    const escribir = (lista) => { localStorage.setItem(CLAVE, JSON.stringify(lista)); };
    let disponible = true;
    try { localStorage.setItem(CLAVE + ':prueba', '1'); localStorage.removeItem(CLAVE + ':prueba'); } catch (e) { disponible = false; }
    return {
      etiqueta: disponible ? 'Guardado en este navegador' : 'Sin guardar: este navegador no permite guardar',
      async guardar(e) {
        if (!disponible) throw new Error('sin almacenamiento');
        const lista = leer().filter((x) => x.id !== e.id);
        lista.push(e);
        escribir(lista);
      },
      async borrar(id) { if (disponible) escribir(leer().filter((x) => x.id !== id)); },
      escuchar(cb) {
        cb(leer());
        window.addEventListener('storage', (ev) => { if (ev.key === CLAVE) cb(leer()); });
      }
    };
  }

  async function almacenClaude() {
    if (!window.claude || typeof window.claude.use !== 'function') return null;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return null;
    const uid = await user.id();
    if (!uid) return null;
    // data/users/<id> es el espacio privado de quien escribe: nadie más lo ve, ni quien comparte la página.
    const col = db.collection('data/users/' + uid);
    return {
      etiqueta: 'Guardado en tu cuenta · privado',
      guardar(e) {
        const { id, ...cuerpo } = e;
        return col.doc(id).set(cuerpo);
      },
      borrar(id) { return col.doc(id).delete(); },
      escuchar(cb, alFallar) {
        col.onSnapshot((snap) => cb(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), alFallar);
      }
    };
  }

  let almacen = null;
  let resolverAlmacen;
  const almacenListo = new Promise((r) => { resolverAlmacen = r; });

  /* ---------------- Indicador de guardado ---------------- */
  const punto = $('[data-punto]');
  const estadoTexto = $('[data-estado-texto]');
  function marcar(tipo, texto) {
    punto.dataset.estado = tipo;
    estadoTexto.textContent = texto;
  }
  const aviso = $('[data-aviso]');
  function avisar(msg) { aviso.textContent = msg; aviso.hidden = !msg; }

  /* ---------------- Guardar: una escritura a la vez por página ---------------- */
  const colas = new Map();
  function guardar(e) {
    if (!tieneTexto(e)) return Promise.resolve();
    const copia = { id: e.id, fecha: e.fecha, titulo: e.titulo || '', cuerpo: e.cuerpo || '', clima: e.clima || null, creada: e.creada, editada: Date.now() };
    pendientes.add(e.id);
    marcar('guardando', 'Guardando…');
    const previa = colas.get(e.id) || Promise.resolve();
    const p = previa
      .then(() => almacenListo)
      .then(() => almacen.guardar(copia))
      .then(() => {
        if (colas.get(e.id) === p) { colas.delete(e.id); pendientes.delete(e.id); }
        avisar('');
        marcar('ok', `${almacen.etiqueta} · ${fmtHora.format(new Date())}`);
      })
      .catch((err) => {
        if (colas.get(e.id) === p) colas.delete(e.id);
        const lleno = err && err.code === 'quota_exceeded';
        marcar('error', 'No se guardó');
        avisar(lleno
          ? 'Tu cuaderno llegó a su límite de espacio. Borra páginas viejas para seguir escribiendo.'
          : 'No se pudo guardar el último cambio. Revisa tu conexión; lo intentamos otra vez en cuanto sigas escribiendo.');
        sucio = true;
      });
    colas.set(e.id, p);
    return p;
  }

  function programarGuardado() {
    sucio = true;
    clearTimeout(temporizador);
    temporizador = setTimeout(guardarAhora, 700);
  }
  function guardarAhora() {
    clearTimeout(temporizador);
    const e = estado.actual;
    if (!e || !sucio) return;
    sucio = false;
    if (tieneTexto(e)) {
      estado.entradas.set(e.id, e);
      guardar(e);
    }
  }

  /* ---------------- Elementos ---------------- */
  const titulo = $('[data-titulo]');
  const cuerpo = $('[data-cuerpo]');
  const fecha = $('[data-fecha]');
  const fechaTexto = $('[data-fecha-texto]');
  const climas = $('[data-climas]');
  const lista = $('[data-paginas]');
  const dias = $('[data-dias]');

  climas.innerHTML = CLIMAS.map((c) =>
    `<button class="clima" type="button" data-clima="${c.v}" aria-pressed="false" style="--c: var(--c${c.v})" title="${c.nombre}">` +
      `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONO[c.v]}</svg><span class="sr-only">${c.nombre}</span></button>`
  ).join('');

  function ajustarAlto() {
    cuerpo.style.height = 'auto';
    cuerpo.style.height = cuerpo.scrollHeight + 'px';
  }

  /* ---------------- Abrir una página en la hoja ---------------- */
  function abrir(e, { enfocar = false } = {}) {
    guardarAhora();
    estado.actual = e;
    sucio = false;
    titulo.value = e.titulo || '';
    cuerpo.value = e.cuerpo || '';
    fecha.value = e.fecha;
    fecha.max = hoyISO();
    $('[data-confirmar]').hidden = true;
    const d = aFecha(e.fecha);
    estado.mes = { y: d.getFullYear(), m: d.getMonth() };
    pintarHoja();
    pintarIndice();
    ajustarAlto();
    if (enfocar) cuerpo.focus({ preventScroll: true });
  }

  function nuevaPagina(iso = hoyISO()) {
    return { id: nuevoId(), fecha: iso, titulo: '', cuerpo: '', clima: null, creada: Date.now() };
  }

  /* Abre la página de ese día si ya existe; si no, una hoja en blanco con esa fecha. */
  function abrirDia(iso, opciones) {
    const delDia = [...estado.entradas.values()].filter((x) => x.fecha === iso).sort(ordenar)[0];
    abrir(delDia || nuevaPagina(iso), opciones);
  }

  function pintarHoja() {
    const e = estado.actual;
    fechaTexto.textContent = capital(fmtLarga.format(aFecha(e.fecha)));
    climas.querySelectorAll('[data-clima]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.clima) === e.clima)));
    const n = palabras(e.cuerpo || '');
    $('[data-conteo]').textContent = n
      ? `${fmtNum.format(n)} ${n === 1 ? 'palabra' : 'palabras'} · ${Math.max(1, Math.round(n / 200))} min de lectura`
      : 'Página en blanco';
    const tags = etiquetasDe(e.cuerpo || '');
    const pie = $('[data-pie-etiquetas]');
    pie.textContent = '';
    if (tags.length) tags.forEach((t) => { const s = document.createElement('span'); s.textContent = '#' + t; pie.appendChild(s); });
    else pie.textContent = 'Escribe #algo para etiquetar';
    $('[data-idea]').hidden = Boolean((e.cuerpo || '').trim());
    $('[data-idea-texto]').textContent = IDEAS[estado.idea];
    cuerpo.placeholder = 'Cuéntalo todo. Nadie más lo lee.';
    $('[data-borrar]').hidden = !estado.entradas.has(e.id);
  }

  /* ---------------- Índice ---------------- */
  function visibles() {
    const q = normal(estado.filtroTexto.trim());
    return [...estado.entradas.values()]
      .filter((e) => !estado.filtroEtiqueta || etiquetasDe(e.cuerpo || '').includes(estado.filtroEtiqueta))
      .filter((e) => !q || normal(`${e.titulo} ${e.cuerpo}`).includes(q))
      .sort(ordenar);
  }

  function racha() {
    const dias = new Set([...estado.entradas.values()].map((e) => e.fecha));
    const d = new Date();
    if (!dias.has(isoDe(d))) d.setDate(d.getDate() - 1);   // si hoy no has escrito, la racha sigue viva hasta ayer
    let n = 0;
    while (dias.has(isoDe(d))) { n += 1; d.setDate(d.getDate() - 1); }
    return n;
  }

  function pintarCalendario() {
    const { y, m } = estado.mes;
    $('[data-mes-nombre]').textContent = capital(fmtMes.format(new Date(y, m, 1)));
    const hoy = hoyISO();
    const porDia = new Map();
    [...estado.entradas.values()].sort(ordenar).forEach((e) => { if (!porDia.has(e.fecha)) porDia.set(e.fecha, e); });
    const cab = ['D', 'L', 'M', 'M', 'J', 'V', 'S'].map((x) => `<span class="dato" aria-hidden="true">${x}</span>`).join('');
    const vacios = new Date(y, m, 1).getDay();
    const total = new Date(y, m + 1, 0).getDate();
    let html = cab + '<span></span>'.repeat(vacios);
    for (let d = 1; d <= total; d++) {
      const iso = `${y}-${pad(m + 1)}-${pad(d)}`;
      const e = porDia.get(iso);
      const clases = ['dia'];
      if (e) clases.push('tiene');
      if (iso === hoy) clases.push('is-hoy');
      if (iso > hoy) clases.push('is-futuro');
      if (estado.actual && estado.actual.fecha === iso) clases.push('is-abierto');
      const nombre = capital(fmtLarga.format(new Date(y, m, d))) + (e ? ', con página' : '');
      html += `<button type="button" class="${clases.join(' ')}" data-dia="${iso}" aria-label="${nombre}"` +
        (e && e.clima ? ` style="--clima: var(--c${e.clima})"` : '') + (iso > hoy ? ' tabindex="-1" aria-disabled="true"' : '') + `>${d}</button>`;
    }
    dias.innerHTML = html;
  }

  function pintarEtiquetas() {
    const cuenta = new Map();
    estado.entradas.forEach((e) => etiquetasDe(e.cuerpo || '').forEach((t) => cuenta.set(t, (cuenta.get(t) || 0) + 1)));
    const top = [...cuenta.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 12);
    if (estado.filtroEtiqueta && !cuenta.has(estado.filtroEtiqueta)) estado.filtroEtiqueta = null;
    const cont = $('[data-etiquetas]');
    cont.textContent = '';
    top.forEach(([t]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'etiqueta';
      b.dataset.etiqueta = t;
      b.setAttribute('aria-pressed', String(estado.filtroEtiqueta === t));
      b.textContent = '#' + t;
      cont.appendChild(b);
    });
  }

  function pintarLista() {
    const items = visibles();
    lista.textContent = '';
    if (!items.length) {
      const p = document.createElement('p');
      p.className = 'paginas__vacio';
      p.textContent = estado.entradas.size
        ? 'Ninguna página coincide con la búsqueda.'
        : (estado.cargado ? 'Aquí aparecerán tus páginas. La de hoy ya está abierta: empieza a escribir.' : 'Abriendo tu cuaderno…');
      lista.appendChild(p);
      return;
    }
    let grupo = null, ol = null;
    items.forEach((e) => {
      const d = aFecha(e.fecha);
      const clave = `${d.getFullYear()}-${d.getMonth()}`;
      if (clave !== grupo) {
        grupo = clave;
        const sec = document.createElement('section');
        sec.className = 'paginas__mes';
        const h = document.createElement('h3');
        h.className = 'dato';
        h.textContent = fmtMes.format(d);
        ol = document.createElement('ol');
        ol.style.display = 'grid';
        ol.style.gap = '.15rem';
        sec.append(h, ol);
        lista.appendChild(sec);
      }
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pagina-item';
      b.dataset.id = e.id;
      if (estado.actual && estado.actual.id === e.id) b.setAttribute('aria-current', 'true');
      if (e.clima) b.style.setProperty('--clima', `var(--c${e.clima})`);
      const primeraLinea = (e.cuerpo || '').trim().split('\n')[0];
      b.innerHTML =
        '<span class="pagina-item__fecha"><span class="pagina-item__dia"></span><span class="pagina-item__semana dato"></span></span>' +
        '<span class="pagina-item__texto"><span class="pagina-item__titulo"><i aria-hidden="true"></i><span></span></span><span class="pagina-item__extracto"></span></span>';
      b.querySelector('.pagina-item__dia').textContent = d.getDate();
      b.querySelector('.pagina-item__semana').textContent = fmtSemana.format(d).replace('.', '');
      b.querySelector('.pagina-item__titulo span').textContent = (e.titulo || '').trim() || primeraLinea.slice(0, 60) || 'Sin título';
      b.querySelector('.pagina-item__extracto').textContent = (e.titulo || '').trim() ? (e.cuerpo || '').trim().slice(0, 180) : (e.cuerpo || '').trim().slice(primeraLinea.length, 200).trim();
      li.appendChild(b);
      ol.appendChild(li);
    });
  }

  function pintarCifras() {
    const todas = [...estado.entradas.values()];
    $('[data-cifra="paginas"]').textContent = fmtNum.format(todas.length);
    $('[data-cifra="racha"]').textContent = fmtNum.format(racha());
    $('[data-cifra="palabras"]').textContent = fmtNum.format(todas.reduce((s, e) => s + palabras(e.cuerpo || ''), 0));
  }

  let pintando = false;
  function pintarIndice() {
    if (pintando) return;
    pintando = true;
    requestAnimationFrame(() => {
      pintando = false;
      pintarCalendario();
      pintarCifras();
      pintarEtiquetas();
      pintarLista();
    });
  }

  /* ---------------- Llega la lista del almacén ---------------- */
  function recibir(listaRemota) {
    const nueva = new Map();
    listaRemota.forEach((e) => {
      if (!e || typeof e.fecha !== 'string' || borradas.has(e.id)) return;
      nueva.set(e.id, { id: e.id, fecha: e.fecha, titulo: e.titulo || '', cuerpo: e.cuerpo || '', clima: e.clima || null, creada: e.creada || 0, editada: e.editada || 0 });
    });
    // Lo que se está escribiendo aquí manda sobre lo que llega.
    pendientes.forEach((id) => { const local = estado.entradas.get(id); if (local) nueva.set(id, local); });
    const a = estado.actual;
    if (a && (sucio || pendientes.has(a.id)) && tieneTexto(a)) nueva.set(a.id, a);
    estado.entradas = nueva;

    const primeraVez = !estado.cargado;
    estado.cargado = true;
    if (a) {
      const remota = nueva.get(a.id);
      const escribiendo = document.activeElement === cuerpo || document.activeElement === titulo;
      if (primeraVez && !tieneTexto(a)) {
        // Al abrir: si hoy ya escribiste, se abre esa página.
        abrirDia(a.fecha);
        return;
      }
      const cambio = remota && ['fecha', 'titulo', 'cuerpo', 'clima'].some((k) => (remota[k] || '') !== (a[k] || ''));
      if (cambio && !sucio && !pendientes.has(a.id) && !escribiendo) {
        abrir(remota);   // la cambiaste en otro dispositivo
        return;
      }
      if (remota) estado.actual = remota;
    }
    pintarHoja();
    pintarIndice();
  }

  /* ---------------- Eventos ---------------- */
  function alEscribir() {
    const e = estado.actual;
    e.titulo = titulo.value;
    e.cuerpo = cuerpo.value;
    if (tieneTexto(e)) estado.entradas.set(e.id, e);
    ajustarAlto();
    pintarHoja();
    pintarIndice();
    programarGuardado();
  }
  titulo.addEventListener('input', alEscribir);
  cuerpo.addEventListener('input', alEscribir);
  titulo.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); cuerpo.focus(); } });
  [titulo, cuerpo].forEach((el) => el.addEventListener('blur', guardarAhora));

  fecha.addEventListener('change', () => {
    if (!fecha.value || fecha.value > hoyISO()) { fecha.value = estado.actual.fecha; return; }
    estado.actual.fecha = fecha.value;
    const d = aFecha(fecha.value);
    estado.mes = { y: d.getFullYear(), m: d.getMonth() };
    pintarHoja();
    pintarIndice();
    programarGuardado();
  });

  climas.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-clima]');
    if (!b) return;
    const v = Number(b.dataset.clima);
    estado.actual.clima = estado.actual.clima === v ? null : v;
    pintarHoja();
    pintarIndice();
    programarGuardado();
  });

  document.querySelector('[data-nueva]').addEventListener('click', () => {
    const a = estado.actual;
    if (a && !tieneTexto(a)) { mostrar('hoja'); cuerpo.focus(); return; }
    abrir(nuevaPagina(), { enfocar: true });
    mostrar('hoja');
  });

  lista.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-id]');
    if (!b) return;
    const e = estado.entradas.get(b.dataset.id);
    if (e) { abrir(e); mostrar('hoja'); window.scrollTo({ top: 0 }); }
  });

  dias.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-dia]');
    if (!b || b.classList.contains('is-futuro')) return;
    abrirDia(b.dataset.dia, { enfocar: true });
    mostrar('hoja');
  });

  document.querySelectorAll('[data-mes]').forEach((b) => b.addEventListener('click', () => {
    const d = new Date(estado.mes.y, estado.mes.m + Number(b.dataset.mes), 1);
    estado.mes = { y: d.getFullYear(), m: d.getMonth() };
    pintarCalendario();
  }));

  $('[data-buscar]').addEventListener('input', (ev) => { estado.filtroTexto = ev.target.value; pintarLista(); });
  $('[data-etiquetas]').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-etiqueta]');
    if (!b) return;
    estado.filtroEtiqueta = estado.filtroEtiqueta === b.dataset.etiqueta ? null : b.dataset.etiqueta;
    pintarEtiquetas();
    pintarLista();
  });

  $('[data-otra-idea]').addEventListener('click', () => {
    estado.idea = (estado.idea + 1) % IDEAS.length;
    $('[data-idea-texto]').textContent = IDEAS[estado.idea];
  });

  // Borrar con confirmación dentro de la página
  const confirmar = $('[data-confirmar]');
  $('[data-borrar]').addEventListener('click', () => { confirmar.hidden = false; $('[data-borrar-no]').focus(); });
  $('[data-borrar-no]').addEventListener('click', () => { confirmar.hidden = true; $('[data-borrar]').focus(); });
  $('[data-borrar-si]').addEventListener('click', async () => {
    const e = estado.actual;
    clearTimeout(temporizador);
    sucio = false;
    borradas.add(e.id);
    pendientes.delete(e.id);
    estado.entradas.delete(e.id);
    confirmar.hidden = true;
    const siguiente = visibles()[0];
    abrir(siguiente || nuevaPagina());
    try {
      await (colas.get(e.id) || Promise.resolve());
      await almacenListo;
      await almacen.borrar(e.id);
      marcar('ok', 'Página borrada');
    } catch (err) {
      marcar('error', 'No se borró');
      avisar('No se pudo borrar la página. Revisa tu conexión e inténtalo de nuevo.');
      borradas.delete(e.id);
    }
  });

  // Vista en pantallas angostas: índice u hoja
  function mostrar(vista) { document.body.dataset.vista = vista; }
  $('[data-ver-indice]').addEventListener('click', () => { guardarAhora(); mostrar('indice'); window.scrollTo({ top: 0 }); });

  window.addEventListener('resize', ajustarAlto);
  window.addEventListener('pagehide', guardarAhora);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') guardarAhora(); });

  /* ---------------- Arranque ---------------- */
  abrir(nuevaPagina());

  (async () => {
    let elegido = null;
    try { elegido = await almacenClaude(); } catch (e) { elegido = null; }
    almacen = elegido || almacenLocal();
    resolverAlmacen();
    marcar(almacen.etiqueta.startsWith('Sin') ? 'error' : 'ok', almacen.etiqueta);
    almacen.escuchar(recibir, () => {
      marcar('error', 'Sin conexión con tu cuaderno');
      avisar('Se perdió la conexión con tu cuaderno. Recarga la página para ver tus páginas al día.');
    });
  })();
})();
</script>
</body>
</html>
